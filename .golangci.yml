version: '2'

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell

  settings:
    staticcheck:
      checks:
        - all
        - -ST1000

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/AntoinePoisson/finite-goods)
